<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAT 353 — Topic Quiz Challenge</title>
<style>
  :root {
    --navy: #0f2942;
    --accent: #d97706;
    --green: #15803d;
    --red: #b91c1c;
    --bg: #f4f6f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    color: #1f2937;
    font-size: 16px;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 24px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; opacity: 0.85; font-size: 0.95rem; }

  /* Topic selector — a dropdown handles 15 topics far better than tabs on
     any screen size, phone included, with no wrapping/scrolling tricks needed. */
  .topic-select-wrap {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 16px;
  }
  .topic-select-wrap label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 6px;
  }
  #topicSelect {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px; /* avoids iOS auto-zoom on focus */
    font-weight: 600;
    color: var(--navy);
    background: white;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 18px;
    padding-right: 40px;
  }
  #topicSelect:focus { border-color: var(--navy); outline: none; }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 16px auto 24px;
    padding: 0 16px;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 2fr 1fr; align-items: start; }
  }

  .card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 20px;
  }

  #nameGate label { display: block; margin-bottom: 8px; font-weight: 600; }
  #nameGate input {
    width: 100%; padding: 12px; font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
    border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px;
  }
  #nameGate .hint { font-size: 0.85rem; color: #64748b; margin-top: -4px; margin-bottom: 14px; }
  button {
    background: var(--navy); color: white; border: none;
    padding: 12px 18px; font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    min-height: 46px; /* comfortable tap target */
  }
  button:hover { opacity: 0.9; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }

  .question {
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 0;
  }
  .question:last-child { border-bottom: none; }
  .question p.stem { font-weight: 600; margin: 0 0 10px; line-height: 1.4; }
  .choices label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 12px 12px;
    margin-bottom: 8px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px; /* comfortable tap target on phones */
    line-height: 1.4;
  }
  .choices label:active { background: #f1f5f9; }
  .choices label:hover { background: #f8fafc; }
  .choices input {
    margin: 3px 0 0;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
  }

  #timer {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
  }

  #resultBox { text-align: center; padding: 30px 20px; }
  #resultBox .score { font-size: 2.4rem; font-weight: 700; color: var(--green); }

  table.leaderboard { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  table.leaderboard th, table.leaderboard td {
    text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e7eb;
  }
  table.leaderboard th { color: #64748b; font-weight: 600; }
  tr.rank-1 { background: #fef3c7; font-weight: 700; }
  tr.rank-2 { background: #f1f5f9; }
  tr.rank-3 { background: #f8fafc; }
  #lbUpdated { font-size: 0.78rem; color: #94a3b8; margin-top: 8px; }
  .hidden { display: none !important; }
  #topicHeading { margin: 0 0 4px; font-size: 1.15rem; color: var(--navy); }
  #topicSub { margin: 0 0 16px; font-size: 0.88rem; color: #64748b; }

  /* ---------- Phone-specific tightening ---------- */
  @media (max-width: 600px) {
    header { padding: 16px 14px; }
    header h1 { font-size: 1.15rem; }
    header p { font-size: 0.8rem; }
    .layout { padding: 0 10px; gap: 14px; margin: 12px auto 16px; }
    .card { padding: 14px; border-radius: 8px; }
    #topicHeading { font-size: 1rem; }
    #topicSub { font-size: 0.82rem; margin-bottom: 12px; }
    .question p.stem { font-size: 0.95rem; }
    .choices label { font-size: 0.92rem; }
    button { font-size: 0.95rem; }
    table.leaderboard { font-size: 0.82rem; }
    table.leaderboard th, table.leaderboard td { padding: 6px 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>STAT 353 — Topic Quiz Challenge</h1>
  <p>Statistical Methods for Engineering &nbsp;|&nbsp; Teams compete topic by topic &nbsp;|&nbsp; Best score wins each round</p>
</header>

<div class="topic-select-wrap">
  <label for="topicSelect">Choose a topic:</label>
  <select id="topicSelect"></select>
</div>

<div class="layout">
  <!-- LEFT: Quiz -->
  <div>
    <h2 id="topicHeading"></h2>
    <p id="topicSub"></p>

    <div class="card" id="nameGate">
      <label for="teamName">Enter your team name to begin:</label>
      <input type="text" id="teamName" placeholder="e.g. Team Bernoulli" autocomplete="off">
      <label for="topicPassword">Topic password:</label>
      <input type="password" id="topicPassword" placeholder="Ask your instructor" autocomplete="off">
      <div class="hint">Each team gets one attempt per topic — best score wins that round.</div>
      <button id="startBtn">Start Quiz</button>
    </div>

    <form class="card hidden" id="quizForm">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div>Time elapsed: <span id="timer">00:00</span></div>
        <div id="progress" style="color:#64748b; font-size:0.9rem;"></div>
      </div>
      <div id="questionContainer"></div>
      <div style="margin-top: 16px; text-align:center;">
        <button type="submit" id="submitBtn">Submit Quiz</button>
      </div>
    </form>

    <div class="card hidden" id="resultBox">
      <div>Your team scored</div>
      <div class="score"><span id="scoreVal">0</span>/<span id="scoreTotal">20</span></div>
      <div id="rankMsg" style="margin-top:10px; color:#475569;"></div>
    </div>
  </div>

  <!-- RIGHT: Live leaderboard -->
  <div class="card">
    <h3 style="margin-top:0;">🏆 Live Leaderboard — <span id="lbTopicLabel"></span></h3>
    <table class="leaderboard">
      <thead><tr><th>#</th><th>Team</th><th>Score</th></tr></thead>
      <tbody id="leaderboardBody">
        <tr><td colspan="3" style="color:#94a3b8;">Loading…</td></tr>
      </tbody>
    </table>
    <div id="lbUpdated"></div>
  </div>
</div>

<script>
/* ============ CONFIGURE THIS ============ */
const APPS_SCRIPT_URL = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE'; // ends in /exec
/* ========================================= */

/* ============ TOPICS ============
   To add a new topic later:
   1. Add a new entry to the TOPICS object below (id must match a key you add
      to ANSWER_KEYS in Code.gs).
   2. Add its 20 [stem, [choice0..choice3]] pairs to `questions`.
   That's it — tabs, quiz rendering, and its own live leaderboard are all automatic.
*/
const TOPICS = {

  topic1: {
    label: 'Topic 1',
    title: 'Experiment, Sample Space, Events & Counting Methods',
    questions: [
      ["Which of the following best describes a \"sample space\"?",
       ["The set of all possible outcomes of an experiment","A single outcome of an experiment","A numerical summary of a data set","The probability of an event"]],

       ["Any process or procedure that leads to well-defined outcomes","Only a controlled laboratory procedure","A hypothesis test","A random sample of data already collected"]],

       ["A subset of the sample space","A single trial of an experiment","The complement of the sample space","A numerical function on outcomes"]],
      ["A fair six-sided die is rolled once. The sample space is:",
       ["{1, 2, 3, 4, 5, 6}","{1, 2, 3}","{Heads, Tails}","{0, 1}"]],
      ["Two fair coins are flipped. How many outcomes are in the sample space?",
       ["2","3","4","8"]],
      ["Let A = \"rolling an even number\" on a fair six-sided die. Which set represents A?",
       ["{1, 3, 5}","{2, 4, 6}","{1, 2, 3, 4, 5, 6}","{6}"]],
      ["If events A and B are mutually exclusive, then:",
       ["A ∩ B = ∅","A ∪ B = S","A = B","A ∩ B = S"]],
      ["Two events A and B are called \"exhaustive\" (relative to sample space S) if:",
       ["A ∪ B = S","A ∩ B = ∅","A = B′","P(A) = P(B)"]],
      ["The complement of event A, denoted A′, consists of:",
       ["All outcomes in A","All outcomes in S that are not in A","All outcomes in both A and B","The empty set"]],
      ["Drawing a single card from a standard deck — how many outcomes are in the sample space?",
       ["13","4","52","26"]],
      ["A manufacturing process has 3 independent steps with 4, 5, and 2 choices respectively. By the multiplication rule, the total number of possible outcomes is:",
       ["11","40","20","9"]],
      ["How many distinct ways can 5 different textbooks be arranged in a row on a shelf?",
       ["5","25","120","10"]],
      ["The permutation formula for choosing and ordering r items from n distinct items is P(n,r) =",
       ["n! / (n − r)!","n! / [r!(n − r)!]","n! / r!","r! / n!"]],
      ["How many ways can a committee of 3 students be chosen from 10 students, if order doesn't matter?",
       ["720","120","1000","30"]],
      ["What distinguishes a combination from a permutation?",
       ["A combination counts arrangements where order matters","A combination counts selections where order does not matter","A combination always equals the corresponding permutation","Combinations only apply to continuous outcomes"]],
      ["A license plate has 3 letters followed by 4 digits, with repetition allowed. How many distinct plates are possible?",
       ["26³ × 10⁴","26 × 10","(26 × 10)⁷","26⁴ × 10³"]],
      ["In how many distinct ways can 4 people be seated in a row of 4 chairs?",
       ["4","16","24","256"]],
      ["A shop offers 3 sizes, 4 crust types, and 6 toppings, where a customer picks exactly one of each. How many distinct orders are possible?",
       ["13","72","18","24"]],
      ["An experiment consists of rolling two fair dice. How many outcomes are in the sample space?",
       ["12","36","6","21"]],
      ["Which counting method should be used to select a committee of 4 people from a group of 12, where order does not matter?",
       ["Permutation","Combination","Multiplication rule alone","Addition rule"]]
    ]
  },

  topic2: {
    label: 'Topic 2',
    title: "Probability, Conditional Probability, Independence & Bayes' Formula",
    questions: [
      ["For any event A, the probability P(A) always satisfies:",
       ["P(A) can be negative","0 ≤ P(A) ≤ 1","P(A) ≥ 1","−1 ≤ P(A) ≤ 1"]],
      ["If S is the entire sample space, then P(S) =",
       ["0","0.5","Undefined","1"]],
      ["Under the classical (equally likely outcomes) definition, P(A) =",
       ["Number of outcomes in A / Number of outcomes in S","Number of outcomes in S / Number of outcomes in A","1 − (number of outcomes in A)","Number of outcomes in A, only"]],
      ["The addition rule for two events A and B states P(A ∪ B) =",
       ["P(A) + P(B)","P(A) × P(B)","P(A) + P(B) − P(A ∩ B)","P(A) − P(B)"]],
      ["If A and B are mutually exclusive, then P(A ∪ B) =",
       ["P(A) × P(B)","P(A) + P(B)","P(A) − P(B)","0"]],
      ["The conditional probability of A given B is defined as P(A|B) =",
       ["P(A) / P(B)","P(A ∩ B) / P(A)","P(B) / P(A)","P(A ∩ B) / P(B), provided P(B) > 0"]],
      ["The multiplication rule states P(A ∩ B) =",
       ["P(A) · P(B|A)","P(A) + P(B)","P(A|B) · P(B|A)","P(A) − P(B)"]],
      ["Events A and B are independent if and only if:",
       ["P(A ∩ B) = 0","P(A|B) = 0","P(A ∩ B) = P(A)P(B)","A ∩ B = S"]],
      ["If A and B are independent, then P(A|B) =",
       ["P(B)","P(A)","0","P(A)P(B)"]],
      ["If A and B are mutually exclusive with P(A) > 0 and P(B) > 0, then A and B are:",
       ["Always independent","Independent only if P(A) = P(B)","Independent only if S is finite","Never independent — they are necessarily dependent"]],
      ["The Law of Total Probability partitions the sample space into events B₁,…,Bₙ. Then P(A) =",
       ["Σ P(A|Bᵢ) P(Bᵢ)","Σ P(A) P(Bᵢ)","Σ P(Bᵢ)","P(A) / Σ P(Bᵢ)"]],
      ["For the Law of Total Probability to apply, the events B₁,…,Bₙ must be:",
       ["Independent only","Equally likely","Mutually exclusive and exhaustive (a partition of S)","Subsets of A"]],
      ["Bayes' formula is used to compute:",
       ["P(A) directly","P(Bᵢ|A), given P(A|Bᵢ) and P(Bᵢ)","P(A) − P(B)","The variance of A"]],
      ["Bayes' Theorem states P(Bᵢ|A) =",
       ["P(A|Bᵢ) / P(Bᵢ)","P(Bᵢ) / P(A|Bᵢ)","P(A) P(Bᵢ)","[P(A|Bᵢ) P(Bᵢ)] / P(A)"]],
      ["A box contains 5 red balls and 3 blue balls. What is the probability of drawing a red ball on a single draw?",
       ["5/8","3/8","5/3","1/8"]],
      ["From the same box (5 red, 3 blue), draw two balls without replacement. What is P(2nd ball red | 1st ball red)?",
       ["5/8","5/7","4/7","4/8"]],
      ["A factory has two machines. Machine 1 makes 60% of items with a 2% defect rate; Machine 2 makes 40% with a 5% defect rate. Using the total probability formula, the overall probability an item is defective is:",
       ["0.02 + 0.05","0.6(0.02) + 0.4(0.05) = 0.032","0.6 × 0.4","0.02 × 0.05"]],
      ["Using the factory example above, if an item is found defective, which formula finds the probability it came from Machine 1?",
       ["Addition rule","Multiplication rule for independent events only","Complement rule","Bayes' formula"]],
      ["If P(A) = 0.3, P(B) = 0.4, and A and B are independent, then P(A ∩ B) =",
       ["0.12","0.7","0.1","0.3"]],
      ["If P(A) = 0.5, P(B) = 0.3, and P(A ∩ B) = 0.15, are A and B independent?",
       ["No","Cannot be determined from this information","Yes, since P(A)P(B) = P(A ∩ B)","Only if they are also mutually exclusive"]]
    ]
  },

  topic3: {
    label: 'Topic 3',
    title: 'Discrete Random Variables: pmf, Mean, SD, Binomial, Geometric & Poisson',
    questions: [
      ["A discrete random variable X is characterized by:",
       ["Its cumulative distribution being differentiable everywhere","A continuous density function","A pmf assigning probabilities to each possible value, with probabilities summing to 1","Only its mean"]],
      ["For a valid probability mass function (pmf) p(x), which condition must hold?",
       ["0 ≤ p(x) ≤ 1 for all x, and Σ p(x) = 1","p(x) can be any real number","p(x) ≥ 1 for all x","Σ p(x) = 0"]],
      ["The mean (expected value) of a discrete random variable X is computed as:",
       ["Σ p(x)","Σ x","Σ (x − μ)","Σ x·p(x)"]],
      ["The variance of a discrete random variable X is defined as:",
       ["E[X]","E[(X − μ)²] = Σ (x − μ)² p(x)","Σ x p(x)","Σ (x − μ)"]],
      ["The standard deviation of X is:",
       ["The same as the mean","The square of the variance","The square root of the variance","Always equal to 1"]],
      ["A binomial random variable models:",
       ["The number of successes in n independent trials, each with the same success probability p","The number of trials until the first success","The number of events in a fixed interval of time","A continuous outcome bounded between 0 and 1"]],
      ["For X ~ Binomial(n, p), the pmf is:",
       ["pˣ(1 − p)ⁿ⁻ˣ","C(n,x) pˣ","np(1 − p)","C(n,x) pˣ (1 − p)ⁿ⁻ˣ"]],
      ["For X ~ Binomial(n, p), the mean is:",
       ["np(1 − p)","np","n/p","p/n"]],
      ["For X ~ Binomial(n, p), the variance is:",
       ["np","n(1 − p)","np(1 − p)","p(1 − p)"]],
      ["Which of the following is a required condition for a binomial experiment?",
       ["Trials are independent, each with the same constant probability of success","The probability of success changes each trial","The number of trials is infinite","Outcomes are continuous"]],
      ["A geometric random variable models:",
       ["The number of successes in n trials","The number of events in a fixed time interval","The sum of n independent normal variables","The number of trials needed to get the first success in a sequence of independent Bernoulli trials"]],
      ["For X ~ Geometric(p), where X is the trial number of the first success, the pmf is:",
       ["pˣ(1 − p)","(1 − p)ˣ⁻¹ p, for x = 1, 2, 3, …","C(x,1) p","p(1 − p)"]],
      ["For X ~ Geometric(p), the mean is:",
       ["p","(1 − p)/p²","1/p","1/(1 − p)"]],
      ["For X ~ Geometric(p), the variance is:",
       ["(1 − p)/p²","1/p","p(1 − p)","1/p²"]],
      ["A Poisson random variable is typically used to model:",
       ["The number of trials until success","The proportion of successes in a sample","A bounded discrete outcome between 0 and n","The number of rare events occurring in a fixed interval of time or space"]],
      ["For X ~ Poisson(λ), the pmf is:",
       ["λˣ / x!","e^(−λ) λˣ / x!, for x = 0, 1, 2, …","e^(−λ)/λ","λ e^(−λx)"]],
      ["For X ~ Poisson(λ), the mean and the variance are both equal to:",
       ["λ²","√λ","λ","1/λ"]],
      ["A call center receives an average of 4 calls per minute, and calls arrive independently. Which distribution best models the number of calls in a given minute?",
       ["Poisson(λ = 4)","Binomial(n = 4, p unknown)","Geometric(p = 4)","Uniform(0, 4)"]],
      ["A basketball player makes free throws independently with probability 0.7 each. Let X = number made out of 10 attempts. What distribution does X follow, and what is E[X]?",
       ["Geometric(0.7); E[X] = 1/0.7","Poisson(0.7); E[X] = 0.7","Binomial(10, 0.3); E[X] = 3","Binomial(10, 0.7); E[X] = 7"]],
      ["Using the same shooter (p = 0.7 success per attempt, independent), let Y = number of attempts until the first miss. Which distribution and parameter models Y?",

    ]
  },

  topic4: {
    label: 'Topic 4',

      ["For a valid probability density function (pdf) f(x), which condition must hold?",
       ["f(x) ≤ 1 for all x","f(x) ≥ 0 for all x, and the total area under f(x) equals 1","f(x) must be symmetric","f(x) sums to 1 over discrete values"]],
      ["For a continuous random variable X, P(X = c) for any single point c is:",
       ["1","f(c)","0","Undefined"]],
      ["For continuous X with pdf f(x), the mean is computed as:",
       ["∫ x f(x) dx over the support of X","∫ f(x) dx","Σ x f(x)","∫ (x − μ) dx"]],
      ["The variance of a continuous random variable X is:",
       ["∫ x f(x) dx","E[X]","∫ f(x) dx","E[(X − μ)²] = ∫ (x − μ)² f(x) dx"]],
      ["The standard deviation of X is:",
       ["The square of the variance","The square root of the variance","Always equal to the mean","The integral of f(x)"]],
      ["If X ~ Uniform(a, b), the pdf f(x) is:",

       ["(a + b)/2","(b − a)/2","(b − a)²/12","a + b"]],
      ["For X ~ Uniform(a, b), the variance is:",
       ["(a + b)/2","(b − a)/2","(b − a)²/4","(b − a)²/12"]],
      ["The normal distribution's pdf is characterized by parameters:",
       ["Only λ","Mean μ and standard deviation σ","a and b (lower and upper bounds)","Only the variance"]],

      ["The exponential distribution is often used to model:",
       ["The number of successes in n trials","The waiting time until the next event in a Poisson process","A bounded outcome between a and b","A symmetric bell-shaped variable"]],

       ["e^(−λx) for x ≥ 0","λˣ e^(−λ)/x!","λe^(−λx) for x ≥ 0, and 0 otherwise","1/λ for x ≥ 0"]],

       ["1/λ","λ","λ²","1/λ²"]],
      ["For X ~ Exponential(λ), the variance is:",

      ["The exponential distribution has the \"memoryless\" property, meaning:",

  topic5: {
    label: 'Topic 5',
    title: 'Joint Distributions, Covariance & Correlation',
    questions: [
      ["The joint pmf of two discrete random variables X and Y, p(x,y), gives:",

      ["For a valid joint pmf p(x,y), it must satisfy:",

let currentTopic = Object.keys(TOPICS)[0];
let startTime = null;
let timerInterval = null;
let teamsCompleted = {}; // topicId -> Set of team names already submitted (this browser session)

function buildTopicSelect() {
  const select = document.getElementById('topicSelect');
  select.innerHTML = '';
  Object.entries(TOPICS).forEach(([id, t]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = `${t.label}: ${t.title} (${t.questions.length} questions)`;
    select.appendChild(opt);
  });
  select.value = currentTopic;
  select.addEventListener('change', () => selectTopic(select.value));
}

function selectTopic(id) {
  currentTopic = id;
  document.getElementById('topicSelect').value = id;
  resetToNameGate();
  document.getElementById('topicHeading').textContent = TOPICS[id].label + ': ' + TOPICS[id].title;
  document.getElementById('topicSub').textContent = `${TOPICS[id].questions.length} questions — one attempt per team.`;
  document.getElementById('lbTopicLabel').textContent = TOPICS[id].label;
  refreshLeaderboard();
}

function resetToNameGate() {
  clearInterval(timerInterval);
  document.getElementById('nameGate').classList.remove('hidden');
  document.getElementById('quizForm').classList.add('hidden');
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('quizForm').reset();
  document.getElementById('topicPassword').value = '';
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const name = document.getElementById('teamName').value.trim();
  const password = document.getElementById('topicPassword').value;
  if (!name) { alert('Please enter your team name.'); return; }
  if (!password) { alert('Please enter this topic\'s password.'); return; }

  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = true;
  startBtn.textContent = 'Checking password…';
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=checkPassword&topic=${currentTopic}&password=${encodeURIComponent(password)}`);
    const data = await res.json();
    if (data.status !== 'ok') {
      alert(data.message || 'Incorrect password for this topic.');
      startBtn.disabled = false;
      startBtn.textContent = 'Start Quiz';
      return;
    }
  } catch (err) {
    alert('Could not verify password: ' + err.message + '\nCheck APPS_SCRIPT_URL is set correctly.');
    startBtn.disabled = false;
    startBtn.textContent = 'Start Quiz';
    return;
  }
  startBtn.disabled = false;
  startBtn.textContent = 'Start Quiz';

  document.getElementById('nameGate').classList.add('hidden');
  buildQuiz();
  document.getElementById('quizForm').classList.remove('hidden');
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
});

function updateTimer() {
  const secs = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function buildQuiz() {
  const container = document.getElementById('questionContainer');
  container.innerHTML = '';
  const questions = TOPICS[currentTopic].questions;
  const letters = ['A', 'B', 'C', 'D'];
  questions.forEach(([stem, choices], qi) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `
      <p class="stem">${qi + 1}. ${stem}</p>
      <div class="choices">
        ${choices.map((c, ci) => `
          <label>
            <input type="radio" name="q${qi}" value="${ci}" required>
            <strong>${letters[ci]}.</strong> ${c}
          </label>`).join('')}
      </div>`;
    container.appendChild(div);
  });
  document.getElementById('progress').textContent = `${questions.length} questions`;
  document.getElementById('scoreTotal').textContent = questions.length;
}

document.getElementById('quizForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  clearInterval(timerInterval);

  const questions = TOPICS[currentTopic].questions;
  const answers = questions.map((_, qi) => {
    const checked = document.querySelector(`input[name="q${qi}"]:checked`);
    return checked ? parseInt(checked.value, 10) : -1;
  });
  const durationSec = Math.floor((Date.now() - startTime) / 1000);
  const name = document.getElementById('teamName').value.trim();
  const password = document.getElementById('topicPassword').value;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
      body: JSON.stringify({ name, topic: currentTopic, answers, durationSec, password })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'Submission failed');

    document.getElementById('quizForm').classList.add('hidden');
    document.getElementById('resultBox').classList.remove('hidden');
    document.getElementById('scoreVal').textContent = data.score;
    document.getElementById('scoreTotal').textContent = data.total;
    document.getElementById('rankMsg').textContent =
      `Your team is currently ranked #${data.rank} on the ${TOPICS[currentTopic].label} leaderboard.`;
    refreshLeaderboard();
  } catch (err) {
    alert('Submission failed: ' + err.message + '\nCheck APPS_SCRIPT_URL is set correctly.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Quiz';
  }
});

async function refreshLeaderboard() {
  const body = document.getElementById('leaderboardBody');
  const topicAtRequest = currentTopic;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=leaderboard&topic=${topicAtRequest}`);
    const data = await res.json();
    if (topicAtRequest !== currentTopic) return; // user switched tabs while this was in flight
    const board = data.leaderboard || [];
    if (board.length === 0) {
      body.innerHTML = `<tr><td colspan="3" style="color:#94a3b8;">No submissions yet</td></tr>`;
    } else {
      const medals = ['🥇', '🥈', '🥉'];
      body.innerHTML = board.map((row, i) => `
        <tr class="rank-${i + 1 <= 3 ? i + 1 : ''}">
          <td>${medals[i] || (i + 1)}</td>
          <td>${escapeHtml(row.name)}</td>
          <td>${row.score}/${row.total}</td>
        </tr>`).join('');
    }
    document.getElementById('lbUpdated').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    body.innerHTML = `<tr><td colspan="3" style="color:var(--red);">Couldn't load leaderboard</td></tr>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Init
buildTopicSelect();
selectTopic(currentTopic);
setInterval(refreshLeaderboard, 5000);
</script>
</body>
</html>
